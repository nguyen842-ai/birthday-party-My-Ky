<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- CÁC THẺ META ÉP KHÔNG LƯU CACHE GIAO DIỆN -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Birthday Invitation Generator</title>
    <!-- Mạng lưới CDN cho Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tải Font Playwrite VN từ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+VN&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; 
        }
        .font-playwrite {
            font-family: 'Playwrite VN', cursive;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="w-full max-w-6xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Bảng điều khiển (Control Panel) -->
        <div class="w-full md:w-1/3 p-6 bg-gray-50 border-r border-gray-200 flex flex-col gap-6">
            <h1 class="text-2xl font-bold text-gray-800">Tạo Thiệp Mời</h1>
            <p class="text-sm text-gray-500">Nhập tên khách mời để tự động tạo thiệp. Bức ảnh gốc cần có tên là <code>Untitled-2.jpg</code> đặt cùng thư mục.</p>
            
            <div class="flex flex-col gap-2">
                <label for="guestName" class="text-sm font-semibold text-gray-700">Tên Khách Mời:</label>
                <input type="text" id="guestName" placeholder="Ví dụ: Anh Tuấn..." 
                       class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition font-playwrite text-xl font-bold">
            </div>

            <div class="flex flex-col gap-2 pt-4 border-t border-gray-200">
                <label for="imageUpload" class="text-sm font-semibold text-gray-700">Tải ảnh lên (Dự phòng):</label>
                <input type="file" id="imageUpload" accept="image/*" 
                       class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition">
                <p class="text-xs text-gray-400">Sử dụng nút này nếu ảnh mặc định không hiển thị.</p>
            </div>

            <div class="mt-auto pt-6 flex flex-col gap-3">
                <button id="downloadBtn" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Tải Ảnh Thiệp Mời
                </button>
            </div>
        </div>

        <!-- Khung xem trước (Preview Area) -->
        <div class="w-full md:w-2/3 p-6 flex flex-col items-center justify-center bg-gray-100 min-h-[500px]">
            <div class="relative w-full h-full flex justify-center items-center">
                <canvas id="inviteCanvas" class="w-full h-auto max-h-[75vh] object-contain shadow-lg border border-gray-300 bg-white rounded"></canvas>
                
                <div id="loadingIndicator" class="absolute inset-0 flex flex-col items-center justify-center bg-white bg-opacity-75 z-10 hidden">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-2"></div>
                    <p class="text-sm text-gray-600 font-medium">Đang tải ảnh và font chữ...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('inviteCanvas');
        const ctx = canvas.getContext('2d');
        const nameInput = document.getElementById('guestName');
        const imageUpload = document.getElementById('imageUpload');
        const downloadBtn = document.getElementById('downloadBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');

        let bgImage = new Image();
        let isImageLoaded = false;
        
        // Cấu hình vị trí và font chữ 
        const CONFIG = {
            FONT_FAMILY: "'Playwrite VN', cursive",
            FONT_WEIGHT: "bold",
            TEXT_COLOR: "#111827", 
            BASE_FONT_SIZE: 35, 
            Y_OFFSET_PERCENTAGE_DESKTOP: 0.758, // Tọa độ Y cho Máy tính (Desktop)
            Y_OFFSET_PERCENTAGE_MOBILE: 0.748  // Tọa độ Y cho Điện thoại (Đã lùi lên trên - số càng nhỏ chữ càng cao)
        };

        // Hàm kiểm tra thiết bị đang truy cập có phải là Mobile không
        function checkIsMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
        }

        // Hàm chính để vẽ lại toàn bộ canvas
        function drawCanvas() {
            if (!isImageLoaded) return;

            canvas.width = bgImage.width;
            canvas.height = bgImage.height;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

            const guestName = nameInput.value.trim();
            
            if (guestName) {
                const scaleFactor = canvas.width / 1000;
                const fontSize = Math.floor(CONFIG.BASE_FONT_SIZE * scaleFactor);

                ctx.font = `${CONFIG.FONT_WEIGHT} ${fontSize}px ${CONFIG.FONT_FAMILY}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = CONFIG.TEXT_COLOR;
                
                // Xác định tọa độ Y tùy thuộc vào thiết bị
                const isMobile = checkIsMobile();
                const currentYOffset = isMobile ? CONFIG.Y_OFFSET_PERCENTAGE_MOBILE : CONFIG.Y_OFFSET_PERCENTAGE_DESKTOP;

                const xPos = canvas.width / 2;
                const yPos = canvas.height * currentYOffset;

                ctx.fillText(guestName, xPos, yPos);
            }
        }

        function loadImage(src) {
            isImageLoaded = false;
            loadingIndicator.style.display = 'flex';
            downloadBtn.disabled = true;
            bgImage.crossOrigin = "anonymous"; 

            bgImage.onload = () => {
                isImageLoaded = true;
                loadingIndicator.style.display = 'none';
                downloadBtn.disabled = false;
                drawCanvas();
            };

            bgImage.onerror = () => {
                loadingIndicator.style.display = 'none';
                canvas.width = 800;
                canvas.height = 1131; 
                ctx.fillStyle = '#f9fafb';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#9ca3af';
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Vui lòng tải ảnh thư mời lên qua nút "Tải ảnh lên"', canvas.width/2, canvas.height/2);
            }

            bgImage.src = src;
        }

        nameInput.addEventListener('input', drawCanvas);
        window.addEventListener('resize', drawCanvas); // Cập nhật lại vị trí nếu người dùng xoay màn hình/đổi size cửa sổ

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    loadImage(event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        // Xử lý nút Tải Xuống phân tách riêng biệt
        downloadBtn.addEventListener('click', () => {
            if (!isImageLoaded) return;
            
            const originalText = downloadBtn.innerHTML;
            downloadBtn.innerHTML = "Đang xử lý ảnh...";
            downloadBtn.disabled = true;
            
            const isMobile = checkIsMobile();

            try {
                canvas.toBlob(function(blob) {
                    const fileName = nameInput.value.trim() 
                                    ? `Thiep-Moi-${nameInput.value.trim().replace(/\s+/g, '-')}.jpg` 
                                    : 'Thiep-Moi-Sinh-Nhat.jpg';
                    
                    // Nếu là ĐIỆN THOẠI và có hỗ trợ Share API -> Dùng menu chia sẻ/lưu
                    if (isMobile && navigator.share && navigator.canShare) {
                        const file = new File([blob], fileName, { type: 'image/jpeg' });
                        if (navigator.canShare({ files: [file] })) {
                            navigator.share({
                                files: [file],
                                title: 'Thiệp mời sinh nhật',
                                text: 'Gửi bạn thiệp mời sinh nhật nhé!'
                            }).then(() => {
                                restoreButton();
                            }).catch((err) => {
                                console.error("Lỗi Share API:", err);
                                fallbackDownload(blob, fileName);
                            });
                            return;
                        }
                    }

                    // Nếu là MÁY TÍNH (hoặc điện thoại không hỗ trợ Share) -> Ép tải trực tiếp bình thường
                    fallbackDownload(blob, fileName);

                }, 'image/jpeg', 0.95);
            } catch (error) {
                console.error("Lỗi khi tải ảnh:", error);
                alert("Không thể tải ảnh. Có thể do lỗi Cross-Origin (CORS).");
                restoreButton();
            }

            // Tính năng tải trực tiếp truyền thống
            function fallbackDownload(blob, fileName) {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = fileName;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                    restoreButton();
                }, 500);
            }

            function restoreButton() {
                downloadBtn.innerHTML = originalText;
                downloadBtn.disabled = false;
            }
        });

        window.onload = () => {
            document.fonts.ready.then(() => {
                const timestamp = new Date().getTime();
                loadImage('Untitled-2.jpg?v=' + timestamp);
            });
        };
    </script>
</body>
</html>
